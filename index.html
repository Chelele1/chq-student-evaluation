 if(key==='positions'){panel.append(node('p','hint',lang==='es'?'Opcional: marca solo las posiciones que revisaste. Añade una observación si hace falta.':'Optional: rate only the positions you reviewed. Add an observation when needed.'));SCHEMA.positions.forEach(([en,es],index)=>{const p=index+1;const row=node('div','quick-position');row.append(node('h3','',`P${p} · ${lang==='es'?es:en}`),field(SCHEMA.fields.find(f=>f.key==='p'+p+'_rating')));quickOptional(['p'+p+'_note'],row,'Add observation','Añadir observación');panel.append(row);});}
 else{if(key==='physical')panel.append(node('p','hint',tr('physicalHelp')));addQuickFields(QUICK_FIELDS[key],panel);if(key==='student')quickOptional(['age','email','phone','guardianName','guardianContact','handicap'],panel,'Contact & other student details (optional)','Contacto y otros datos del alumno (opcional)');}
 const nav=node('div','step-actions');const index=QUICK_SECTIONS.findIndex(s=>s[0]===key);if(index>0)nav.append(button(lang==='es'?'Anterior':'Previous',()=>{quickStep=QUICK_SECTIONS[index-1][0];render();}));if(index<3)nav.append(button(lang==='es'?'Siguiente':'Next',()=>{quickStep=QUICK_SECTIONS[index+1][0];render();},'primary'));if(index===3)nav.append(node('p','hint',lang==='es'?'Puedes guardar aquí. La revisión P1–P10 es opcional.':'You can save here. The P1–P10 review is optional.'));panel.append(nav);form.append(panel);}
}


let swingStep='dateinfo';
function simpleValue(e,f){return f[3]?(e.fields[f[3]]||''):(e.simpleFields?.[f[0]]||'');}
function simpleSnapshot(e){return Object.fromEntries(SIMPLE_FIELDS.map(f=>[f[0],simpleValue(e,f)]));}
function simpleField(f){const label=node('label','field'+(f[5]==='textarea'?' wide':''));label.htmlFor='simple-'+f[0];label.append(node('span','field-label',f[lang==='es'?1:2]+(['studentName','date'].includes(f[0])?' *':'')));const input=node(f[5]==='textarea'?'textarea':'input');if(f[5]==='textarea'){input.rows=1;input.placeholder=lang==='es'?'Tu opinión…':'Your comments…';}else input.type=f[5];input.id=label.htmlFor;input.name=f[0];input.maxLength=4000;input.required=['studentName','date'].includes(f[0]);input.value=simpleValue(current(),f);input.disabled=busy;input.oninput=input.onchange=()=>{if(f[3])change(f[3],input.value);else{const e=current();e.simpleFields=e.simpleFields||{};if(e.simpleFields[f[0]]===input.value)return;e.simpleFields[f[0]]=input.value;e.state='draft';e.updatedAt=new Date().toISOString();e.pending=null;persist();updateStatus();}if(input.tagName==='TEXTAREA'){input.style.height='auto';input.style.height=Math.max(44,input.scrollHeight)+'px';}};label.append(input);return label;}
const SWING_SECTIONS=[['dateinfo','Alumno','Student'],['setup','Parada y cuerpo','Setup & body'],['swing','Pasos del swing','Swing steps'],['plan','Correcciones y drills','Corrections & drills']];
function swingForm(form,root){const nav=node('nav','swing-nav');for(const [key,es,en] of SWING_SECTIONS){const b=button(lang==='es'?es:en,()=>{if(busy)return;swingStep=key;render();},swingStep===key?'active':'');b.setAttribute('aria-pressed',String(swingStep===key));nav.append(b);}root.append(nav);
for(const [key,es,en] of SWING_SECTIONS){const panel=node('section','swing-panel');panel.id='swing-'+key;panel.hidden=swingStep!==key;panel.append(node('h2','',lang==='es'?es:en));const grid=node('div','grid');SIMPLE_FIELDS.filter(f=>f[4]===key).forEach(f=>grid.append(simpleField(f)));panel.append(grid);
if(key==='plan'){const optional=node('details','swing-optional');optional.append(node('summary','',lang==='es'?'Otras notas · opcional':'Other notes · optional'));const hints={behavior:['Actitud, asistencia, concentración, puntualidad y espíritu deportivo.','Attitude, attendance, concentration, punctuality and sportsmanship.'],physical:['Fuerza, velocidad, condición física, resistencia e impedimentos o limitaciones reportadas.','Strength, speed, fitness, stamina and any reported physical limitations.'],skills:['Chip, bunker y golpes de 100/80, 60/40 y 40/20 yardas (distancia menor para jugadores más pequeños).','Chip, bunker and 100/80, 60/40 and 40/20 yard shots (shorter distances for smaller players).'],putting:['Postura, alineación, repetición de la trayectoria y orientación de la cara del palo al impacto.','Posture, alignment, repeatability of the stroke path and clubface orientation at impact.']};for(const f of SIMPLE_FIELDS.filter(f=>f[4]==='optional')){optional.append(simpleField(f),node('p','hint',hints[f[0]][lang==='es'?0:1]));}panel.append(optional);}
const steps=node('div','step-actions');const index=SWING_SECTIONS.findIndex(x=>x[0]===key);if(index>0)steps.append(button(lang==='es'?'Anterior':'Previous',()=>{swingStep=SWING_SECTIONS[index-1][0];render();}));if(index<3)steps.append(button(lang==='es'?'Siguiente':'Next',()=>{swingStep=SWING_SECTIONS[index+1][0];render();},'primary'));panel.append(steps);form.append(panel);}}
