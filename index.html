function renderHistory(){const list=document.querySelector('#historyList');if(!list)return;list.replaceChildren();const q=search.trim().toLowerCase();const evaluations=Object.values(db.evaluations).filter(e=>(e.fields.studentName+' '+e.fields.studentId).toLowerCase().includes(q)).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));if(!evaluations.length)list.append(node('p','hint',tr('empty')));
 for(const e of evaluations){const item=node('div','history-item');const row=node('div','history-row');const info=node('div');info.append(node('strong','',e.fields.studentName||tr('draft')),node('p','hint',e.fields.studentId+' · '+e.fields.date+' · '+tr(e.lastConfirmed?.fingerprint===fingerprint(e)?'cloud':'unsent')));const open=button(tr('open'),()=>openEvaluation(e));open.disabled=busy;row.append(info,open);item.append(row);const revisions=db.revisions.filter(r=>r.evaluation.id===e.id).sort((a,b)=>b.number-a.number);if(revisions.length){const d=node('details','revision-list');d.append(node('summary','',tr('localRevisions')+' ('+revisions.length+')'));revisions.forEach(r=>{const rrow=node('div','revision-row');rrow.append(node('span','',tr('revisionLabel')+' '+r.number+' · '+r.submittedAt.slice(0,19).replace('T',' ')+' · '+tr(r.confirmed?'cloud':'unsent')));const b=button(tr('reopen'),()=>{const reopened=clone(r.evaluation);reopened.state='draft';reopened.pending=null;reopened.lastConfirmed=null;openEvaluation(reopened);});b.disabled=busy;rrow.append(b);d.append(rrow);});item.append(d);}list.append(item);}}
function validate(){const form=document.querySelector('#evaluationForm');const invalid=form.querySelector(':invalid');if(invalid){let parent=invalid.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement;}}if(!form.reportValidity()){show('invalid');return false;}const f=current().fields;if(!f.studentName.trim()||!f.studentId.trim()||!f.date){show('required');return false;}if(Object.values(db.evaluations).some(e=>e.id!==current().id&&e.fields.studentId.trim()===f.studentId.trim()&&e.fields.studentName.trim().toLowerCase()!==f.studentName.trim().toLowerCase())){show('badId');return false;}if(SCHEMA.metrics.some(([k])=>f['metric_'+k]!=='')&&(!f.measurementClub.trim()||!f.measurementDevice.trim()||!f.measurementShots||!f.measurementNotes.trim())){document.querySelector('#section-measurements').open=true;show('measurementRequired');return false;}return true;}
async function send(){if(busy)return;if(!validate())return;if(!coachKey.trim()){document.querySelector('.access').open=true;show('noKey');return;}const e=current();const fp=fingerprint(e);if(e.lastConfirmed?.fingerprint===fp){show('noChange');return;}
 if(!e.pending||e.pending.fingerprint!==fp){const number=Math.max(0,...db.revisions.filter(r=>r.evaluation.id===e.id).map(r=>r.number))+1;e.pending={revisionId:crypto.randomUUID(),number,submittedAt:new Date().toISOString(),fingerprint:fp};}
 const pending=clone(e.pending);e.state='final';const evaluation=clone(e);delete evaluation.pending;delete evaluation.lastConfirmed;
 const record={...pending,evaluation,confirmed:false};const old=db.revisions.findIndex(r=>r.revisionId===pending.revisionId);if(old>=0)db.revisions[old]=record;else db.revisions.push(record);if(!persist())return;
 const payload={app:'CHQ_STUDENT_EVALUATION',schemaVersion:1,revisionId:pending.revisionId,revisionNumber:pending.number,submittedAt:pending.submittedAt,evaluation};busy=true;message='sending';render();
 try{const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),45000);let response;try{response=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...payload,coachKey:coachKey.trim()}),signal:controller.signal});}finally{clearTimeout(timeout);}const ack=await response.json();if(!response.ok||ack.ok!==true||ack.revisionId!==pending.revisionId)throw new Error(ack.error||'Unconfirmed response');record.confirmed=true;db.revisions[db.revisions.findIndex(r=>r.revisionId===pending.revisionId)]=record;e.lastConfirmed={revisionId:pending.revisionId,fingerprint:fp};e.pending=null;if(!persist())return;message='success';}
 catch(error){console.error(error);message='failed';}
 finally{busy=false;render();if(message==='success')show('success',String(pending.number));}
}
function exportBackup(){const data={...clone(db),exportedAt:new Date().toISOString(),app:'CHQ_STUDENT_EVALUATION_BACKUP'};const a=node('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='CHQ-evaluations-'+localDate()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
async function importBackup(file){if(busy||!file)return;try{if(file.size>20*1024*1024)throw new Error('File too large');const incoming=JSON.parse(await file.text());if(incoming.app!=='CHQ_STUDENT_EVALUATION_BACKUP'||!isDatabase(incoming))throw new Error('Invalid backup');if(!window.confirm(tr('importConfirm')))return;if(!persist())return;let added=0;for(const [id,e] of Object.entries(incoming.evaluations)){if(!Object.hasOwn(db.evaluations,id)){db.evaluations[id]=clone(e);added++;}}for(const r of incoming.revisions)if(!db.revisions.some(x=>x.revisionId===r.revisionId))db.revisions.push(clone(r));if(!persist())return;render();show('restored',tr('restoredCount')+': '+added);}catch(e){show('badBackup');}}
render();persist();
</script></body></html>
